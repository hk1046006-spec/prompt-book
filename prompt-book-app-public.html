    <title>Prompt Book</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --surface: #fffdf8;
        --surface-2: #ece7db;
        --ink: #1c2b39;
        --ink-soft: #43536a;
        --line: #d8d0bf;
        --accent: #b45309;
        --accent-ink: #ffffff;
        --hl: #fde68a;
        --danger: #b3261e;
        --danger-bg: #fbeae8;
        --ok: #166534;
        --ok-bg: #e3f2e6;
        --shadow: 0 1px 3px rgba(28, 43, 57, .12), 0 6px 18px rgba(28, 43, 57, .07);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10161d;
          --surface: #1a232e;
          --surface-2: #232f3d;
          --ink: #eef2f6;
          --ink-soft: #a7b4c2;
          --line: #33424f;
          --accent: #d97706;
          --accent-ink: #ffffff;
          --hl: #92600a;
          --danger: #f08079;
          --danger-bg: #3a2321;
          --ok: #7fd79a;
          --ok-bg: #1e3325;
          --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
      }
      .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 120px; }

      /* ---------- Header ---------- */
      .app-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 6px 0 4px; }
      .app-head h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem; margin: 0; letter-spacing: .2px;
      }
      .app-head .count { color: var(--ink-soft); font-size: .95rem; }
      .install-hint { color: var(--ink-soft); font-size: .9rem; margin: 2px 0 18px; }
      .install-hint strong { color: var(--ink); }

      /* ---------- Search ---------- */
      .search-row { margin-bottom: 16px; }
      .search-row input {
        width: 100%; min-height: 52px; padding: 12px 16px;
        font-size: 1.05rem; color: var(--ink);
        background: var(--surface); border: 1.5px solid var(--line);
        border-radius: var(--radius);
      }
      .search-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

      /* ---------- Prompt cards ---------- */
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 16px; margin-bottom: 14px;
      }
      .card-top { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
      .num {
        flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--ink); color: var(--bg);
        font-family: Georgia, serif; font-weight: 700; font-size: 1.05rem;
        border-radius: 10px;
      }
      .card-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.22rem; font-weight: 700; line-height: 1.3; margin: 2px 0 4px;
        overflow-wrap: anywhere;
      }
      .card-snippet {
        color: var(--ink-soft); font-size: .95rem; margin: 0;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .card-actions { display: flex; gap: 10px; margin-top: 14px; }
      .empty {
        text-align: center; color: var(--ink-soft);
        background: var(--surface); border: 1.5px dashed var(--line);
        border-radius: var(--radius); padding: 36px 20px; font-size: 1.05rem;
      }

      /* ---------- Buttons ---------- */
      button {
        font: inherit; cursor: pointer; border-radius: 12px;
        min-height: 52px; padding: 10px 18px;
        border: 1.5px solid var(--line);
        background: var(--surface-2); color: var(--ink);
        font-weight: 600; font-size: 1rem;
        transition: transform .06s ease, background .15s ease;
        touch-action: manipulation;
      }
      button:active { transform: scale(.97); }
      .btn-copy { flex: 1 1 auto; background: var(--ok); border-color: var(--ok); color: #fff; font-size: 1.05rem; }
      .btn-copy.copied { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
      .btn-icon { flex: 0 0 auto; min-width: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .btn-danger { color: var(--danger); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn-ghost { background: transparent; }
      .btn-delete-confirm { background: var(--danger); border-color: var(--danger); color: #fff; }
      svg.ic { width: 20px; height: 20px; flex: 0 0 auto; }

      /* ---------- Sticky add bar ---------- */
      .addbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--line);
      }
      .addbar .inner { max-width: 780px; margin: 0 auto; }
      .btn-add {
        width: 100%; min-height: 58px; font-size: 1.15rem;
        background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
        display: flex; align-items: center; justify-content: center; gap: 10px;
        box-shadow: var(--shadow);
      }

      /* ---------- Views ---------- */
      .view { display: none; }
      .view.active { display: block; }
      .back-row { margin-bottom: 14px; }
      .btn-back { min-height: 48px; display: inline-flex; align-items: center; gap: 8px; }

      /* ---------- Detail ---------- */
      .detail-title { font-family: Georgia, serif; font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; overflow-wrap: anywhere; }
      .detail-meta { color: var(--ink-soft); font-size: .9rem; margin-bottom: 14px; }
      .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
      .detail-actions .btn-copy { flex: 1 1 180px; }
      .doc {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 20px 18px; overflow-wrap: anywhere;
      }
      .doc h2 { font-family: Georgia, serif; font-size: 1.3rem; margin: 1.1em 0 .4em; }
      .doc h2:first-child, .doc p:first-child { margin-top: 0; }
      .doc p { margin: 0 0 .9em; }
      .doc mark, .doc .hl { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }

      /* ---------- Editor ---------- */
      .field-label { display: block; font-weight: 700; margin: 14px 0 6px; font-size: .95rem; }
      #titleInput {
        width: 100%; min-height: 54px; padding: 12px 14px; font-size: 1.1rem;
        color: var(--ink); background: var(--surface);
        border: 1.5px solid var(--line); border-radius: 12px;
      }
      #titleInput:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
      .toolbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; gap: 8px; flex-wrap: wrap;
        background: var(--surface); border: 1.5px solid var(--line);
        border-radius: 12px; padding: 8px; margin-top: 8px;
      }
      .toolbar button { min-height: 48px; flex: 1 1 auto; padding: 8px 10px; font-size: .98rem; }
      .toolbar .tb-bold { font-weight: 800; }
      .toolbar .tb-hl { background: var(--hl); border-color: var(--line); color: var(--ink); }
      .toolbar .tb-h { font-family: Georgia, serif; font-weight: 700; }
      #editor {
        min-height: 46vh; margin-top: 10px; padding: 16px;
        background: var(--surface); border: 1.5px solid var(--line);
        border-radius: 12px; font-size: 1.05rem; outline: none;
        overflow-wrap: anywhere;
      }
      #editor:focus { border-color: var(--accent); }
      #editor:empty::before { content: "Write or paste your prompt here…"; color: var(--ink-soft); }
      #editor h2 { font-family: Georgia, serif; font-size: 1.3rem; margin: .8em 0 .35em; }
      #editor mark, #editor .hl { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }
      .editor-actions { display: flex; gap: 10px; margin-top: 16px; }
      .editor-actions .btn-primary { flex: 1 1 auto; min-height: 58px; font-size: 1.1rem; }
      .editor-actions .btn-ghost { flex: 0 0 auto; min-height: 58px; }

      /* ---------- Confirm modal ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 50; display: none;
        background: rgba(10, 15, 20, .55);
        align-items: center; justify-content: center; padding: 20px;
      }
      .overlay.open { display: flex; }
      .modal {
        background: var(--surface); color: var(--ink);
        border-radius: 16px; padding: 22px; width: 100%; max-width: 420px;
        box-shadow: var(--shadow);
      }
      .modal h2 { font-family: Georgia, serif; margin: 0 0 8px; font-size: 1.3rem; }
      .modal p { color: var(--ink-soft); margin: 0 0 18px; overflow-wrap: anywhere; }
      .modal-actions { display: flex; gap: 10px; }
      .modal-actions button { flex: 1 1 0; min-height: 54px; }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg);
        padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 1rem;
        opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
        z-index: 60; max-width: calc(100vw - 32px); text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      @media (min-width: 640px) {
        .wrap { padding-top: 32px; }
        .app-head h1 { font-size: 2.4rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">

      <!-- ================= LIST VIEW ================= -->
      <section id="listView" class="view active">
        <div class="app-head">
          <h1>Prompt Book</h1>
          <span class="count" id="countLabel"></span>
        </div>
        <p class="install-hint">On your phone, open the browser menu and tap <strong>“Add to Home screen”</strong> to use it like an app.</p>

        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Search prompts…" autocomplete="off" />
        </div>

        <div id="cardList"></div>
        <div id="emptyState" class="empty" hidden>
          No prompts yet.<br />Tap <strong>+ Add Prompt</strong> below to write or paste your first one.
        </div>
        <div id="noMatch" class="empty" hidden>No prompt matches your search.</div>
      </section>

      <!-- ================= DETAIL VIEW ================= -->
      <section id="detailView" class="view">
        <div class="back-row">
          <button class="btn-back" id="detailBackBtn" type="button">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            All prompts
          </button>
        </div>
        <h2 class="detail-title" id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-actions">
          <button class="btn-copy" id="detailCopyBtn" type="button">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            Copy Full Prompt
          </button>
          <button class="btn-icon" id="detailEditBtn" type="button">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            Edit
          </button>
          <button class="btn-icon btn-danger" id="detailDeleteBtn" type="button">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            Delete
          </button>
        </div>
        <div class="doc" id="detailBody"></div>
      </section>

      <!-- ================= EDITOR VIEW ================= -->
      <section id="editorView" class="view">
        <div class="back-row">
          <button class="btn-back" id="editorBackBtn" type="button">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Back
          </button>
        </div>
        <h2 class="detail-title" id="editorHeading">New Prompt</h2>

        <label class="field-label" for="titleInput">Title</label>
        <input id="titleInput" type="text" placeholder="e.g. My Product Photo Prompt" autocomplete="off" />

        <span class="field-label">Prompt text</span>
        <div class="toolbar" role="toolbar" aria-label="Formatting">
          <button type="button" class="tb-bold" id="tbBold">B&nbsp; Bold</button>
          <button type="button" class="tb-hl" id="tbHighlight">Highlight</button>
          <button type="button" class="tb-h" id="tbHeading">H&nbsp; Heading</button>
          <button type="button" id="tbNormal">Normal</button>
        </div>
        <div id="editor" contenteditable="true" spellcheck="false"></div>

        <div class="editor-actions">
          <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
          <button type="button" class="btn-primary" id="saveBtn">Save Prompt</button>
        </div>
      </section>
    </div>

    <!-- Sticky add bar (list view only) -->
    <div class="addbar" id="addBar">
      <div class="inner">
        <button class="btn-add" id="addBtn" type="button">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add Prompt
        </button>
      </div>
    </div>

    <!-- Delete confirm -->
    <div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal">
        <h2 id="confirmTitle">Delete this prompt?</h2>
        <p id="confirmText"></p>
        <div class="modal-actions">
          <button type="button" id="confirmCancel">Cancel</button>
          <button type="button" class="btn-delete-confirm" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <!-- Seed prompt: the user's Prompt 01, verbatim plain text. Read once on
         first run and converted to the stored rich-text format. -->
    <script type="text/plain" id="seedText">UNIVERSAL E-COMMERCE MASTER PROMPT V3

ROLE:
Act as an elite international e-commerce product photographer, professional photo retoucher, product preservation specialist, and commercial studio image editor. Analyze the uploaded image carefully. Identify its category, colors, materials, shape, texture, transparency, printed information and physical structure. Create a premium marketplace-ready photograph while preserving the exact original product.

RULE 01 — ABSOLUTE PRODUCT IDENTITY LOCK:
The uploaded photograph is the ONLY source of truth. Never redesign, recreate, regenerate or modify the product. Preserve every visible detail. Never change, rewrite, translate, correct, remove or invent text. Preserve all logos, brand names, labels, numbers, symbols, serial numbers, QR codes, barcodes and markings. Never change original colors, shades, materials, finishes, patterns, textures, shapes or designs. Never add, remove, replace or invent physical components. Preserve buttons, ports, stitching, packaging, accessories and decorative details. Never fabricate missing or hidden details.

RULE 02 — ORIGINAL COLOR & MATERIAL PROTECTION:
Maintain exact original colors and shades. No recoloring, color replacement, artificial saturation or color enhancement. Preserve metal, glass, plastic, leather, fabric, wood and silicone appearances. Preserve original texture and natural reflections. Do not make matte surfaces glossy or glossy surfaces matte.

RULE 03 — INTELLIGENT PRODUCT ALIGNMENT:
Detect incorrect camera rotation, unwanted tilt and poor positioning. Correct accidental tilting naturally without changing the product design. Correct perspective only when safe. Preserve proportions and dimensions. Center professionally, maintain balanced margins, keep all important details visible. Never crop, stretch, squeeze or deform. Respect naturally asymmetrical designs.

RULE 04 — ADAPTIVE WHITE BACKGROUND SYSTEM:
Create a clean premium white studio background. Default background: pure white (#FFFFFF). Automatically analyze product colors and select appropriate treatment:
WHITE / CREAM PRODUCTS: Keep an overall white background but use subtle neutral edge separation, soft directional studio lighting and natural gray contact shadows to make the product clearly visible.
BLACK / DARK PRODUCTS: Preserve clear edges with balanced soft lighting and realistic shadows.
SILVER / METALLIC PRODUCTS: Maintain visible contours and realistic material reflections without changing the finish.
TRANSPARENT / GLASS PRODUCTS: Preserve transparency, natural reflections and visible edges using subtle studio lighting and tonal separation.
LIGHT PINK / BEIGE / PASTEL PRODUCTS: Ensure sufficient contrast without changing original shades.
COLORFUL PRODUCTS: Keep the background neutral so original product colors stand out naturally.
Never allow white or light-colored products to disappear into the background. Do not use artificial outlines, fake borders, excessive gradients or colored halos.

RULE 05 — PROFESSIONAL SHADOW & LIGHTING:
Use realistic studio lighting and soft natural contact shadows. Adjust shadow strength according to product color and shape. Avoid excessive dark shadows and floating-product appearance. Maintain natural highlights and reflections. Never use lighting that changes original product colors.

RULE 06 — SMART CATEGORY RECOGNITION:
Automatically identify the category and choose appropriate presentation: electronics clean and precise; cosmetics elegant and premium; watches with clearly visible original dial; jewelry with natural reflections; handbags with clear structure; clothing with accurate fabric; shoes with visible design; kitchen products clean and practical; food with authentic packaging; perfumes with preserved bottle and label; household products clear and functional. Category recognition never authorizes changes to the product.

RULE 07 — STRICT NO-ADDITION POLICY:
Do not add promotional text, prices, discounts, fake brand names, logos, watermarks, unoriginal accessories, flowers, plants, decorative props, unrequested packaging, artificial reflections or unnecessary visual effects.

RULE 08 — PROFESSIONAL IMAGE QUALITY:
Premium commercial product photography, high resolution, sharp natural details, accurate edges, clean background removal, no white halos, blur, pixelation, excessive sharpening or artificial textures. Balanced composition. Product is the primary visual focus.

RULE 09 — UNIVERSAL MARKETPLACE COMPATIBILITY:
Prepare for Daraz, Amazon, Alibaba, Shopify and other e-commerce platforms. Prefer a 1:1 square canvas. Keep the entire product visible. Use suitable resolution and image quality. Do not distort the original aspect ratio. Maintain professional white-background marketplace presentation and follow platform-specific requirements when known.

RULE 10 — FINAL PRODUCT AUTHENTICITY AUDIT:
Compare edited product with original. Verify identity, text, logos, symbols, colors, shades, components, proportions, shape, transparency, edges and absence of invented details. Ensure white products are distinguishable from the background. If any operation risks changing the original product, do not perform it. Preserve unsafe-to-edit areas exactly as in the source photograph.

ULTIMATE INSTRUCTION:
BEAUTIFY THE PHOTOGRAPH, NEVER MODIFY THE PRODUCT. Create a professional, premium, authentic e-commerce studio photograph with intelligent white-background contrast. ORIGINAL PRODUCT AUTHENTICITY ALWAYS HAS THE HIGHEST PRIORITY.</script>

    <script>
      (function () {
        "use strict";

        var STORAGE_KEY = "promptBookPublic.v1";

        /* ---------- helpers ---------- */
        function $(id) { return document.getElementById(id); }
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function newId() {
          return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }
        function plainToHtml(text) {
          return text.split(/\n\s*\n/).map(function (para) {
            return "<p>" + esc(para).replace(/\n/g, "<br>") + "</p>";
          }).join("");
        }
        function htmlToPlain(html) {
          var div = document.createElement("div");
          div.innerHTML = html || "";
          var blocks = div.querySelectorAll("p, h2, h3, div, li");
          if (blocks.length) {
            var parts = [];
            blocks.forEach(function (b) { parts.push(b.innerText.replace(/\s+\n/g, "\n").trim()); });
            return parts.filter(Boolean).join("\n\n");
          }
          return (div.innerText || "").trim();
        }

        /* ---------- storage ---------- */
        function load() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw !== null) {
              var parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) return parsed;
            }
          } catch (e) { /* fall through to seed */ }
          var seed = $("seedText").textContent.replace(/^\n+/, "").replace(/\s+$/, "");
          var firstLine = seed.split("\n")[0].trim();
          var body = seed.slice(seed.indexOf("\n") + 1).replace(/^\n+/, "");
          var items = [{ id: newId(), title: firstLine, html: plainToHtml(body) }];
          save(items);
          return items;
        }
        function save(items) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
          catch (e) { toast("Storage is full — the last change could not be saved."); }
        }

        var prompts = load();
        var currentId = null;   // prompt shown in detail view
        var editingId = null;   // prompt open in editor (null = new)
        var returnTo = "list";  // where editor back/cancel goes
        var pendingDeleteId = null;

        /* ---------- toast ---------- */
        var toastTimer = null;
        function toast(msg) {
          var t = $("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
        }

        /* ---------- views ---------- */
        function show(view) {
          ["listView", "detailView", "editorView"].forEach(function (id) {
            $(id).classList.toggle("active", id === view);
          });
          $("addBar").style.display = view === "listView" ? "" : "none";
          window.scrollTo(0, 0);
        }

        /* ---------- list ---------- */
        function renderList() {
          var q = $("searchInput").value.trim().toLowerCase();
          var list = $("cardList");
          list.innerHTML = "";
          var shown = 0;
          prompts.forEach(function (p, idx) {
            if (q) {
              var hay = (p.title + " " + htmlToPlain(p.html)).toLowerCase();
              if (hay.indexOf(q) === -1) return;
            }
            shown++;
            var card = document.createElement("div");
            card.className = "card";
            var num = String(idx + 1).padStart(2, "0");
            card.innerHTML =
              '<div class="card-top" role="button" tabindex="0" aria-label="Open prompt">' +
                '<div class="num">' + num + "</div>" +
                "<div>" +
                  '<div class="card-title">' + esc(p.title || "Untitled prompt") + "</div>" +
                  '<p class="card-snippet">' + esc(htmlToPlain(p.html).slice(0, 220)) + "</p>" +
                "</div>" +
              "</div>" +
              '<div class="card-actions">' +
                '<button type="button" class="btn-copy" data-act="copy">Copy</button>' +
                '<button type="button" class="btn-icon" data-act="edit" aria-label="Edit">' +
                  '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>' +
                "</button>" +
                '<button type="button" class="btn-icon btn-danger" data-act="delete" aria-label="Delete">' +
                  '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' +
                "</button>" +
              "</div>";
            card.querySelector(".card-top").addEventListener("click", function () { openDetail(p.id); });
            card.querySelector(".card-top").addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(p.id); }
            });
            card.querySelector('[data-act="copy"]').addEventListener("click", function (ev) {
              copyPrompt(p, ev.currentTarget);
            });
            card.querySelector('[data-act="edit"]').addEventListener("click", function () { openEditor(p.id, "list"); });
            card.querySelector('[data-act="delete"]').addEventListener("click", function () { askDelete(p.id); });
            list.appendChild(card);
          });
          $("countLabel").textContent = prompts.length === 1 ? "1 prompt" : prompts.length + " prompts";
          $("emptyState").hidden = prompts.length !== 0;
          $("noMatch").hidden = !(prompts.length > 0 && shown === 0);
        }

        /* ---------- detail ---------- */
        function findPrompt(id) {
          for (var i = 0; i < prompts.length; i++) if (prompts[i].id === id) return prompts[i];
          return null;
        }
        function openDetail(id) {
          var p = findPrompt(id);
          if (!p) return;
          currentId = id;
          var idx = prompts.indexOf(p);
          $("detailTitle").textContent = p.title || "Untitled prompt";
          var words = htmlToPlain(p.html).split(/\s+/).filter(Boolean).length;
          $("detailMeta").textContent = "Prompt " + String(idx + 1).padStart(2, "0") + " · " + words + " words";
          $("detailBody").innerHTML = p.html;
          var btn = $("detailCopyBtn");
          btn.classList.remove("copied");
          show("detailView");
        }

        /* ---------- copy ---------- */
        function copyPrompt(p, btn) {
          var text = htmlToPlain(p.html);
          function done() {
            toast("Copied — full prompt is on your clipboard.");
            if (btn) {
              var old = btn.innerHTML;
              btn.classList.add("copied");
              btn.innerHTML = "✓ Copied";
              setTimeout(function () { btn.classList.remove("copied"); btn.innerHTML = old; }, 2000);
            }
          }
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try { document.execCommand("copy"); done(); }
            catch (e) { toast("Copy failed — open the prompt and copy the text manually."); }
            document.body.removeChild(ta);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
          } else { fallback(); }
        }

        /* ---------- editor ---------- */
        function openEditor(id, from) {
          editingId = id;
          returnTo = from || "list";
          var ed = $("editor");
          if (id) {
            var p = findPrompt(id);
            if (!p) return;
            $("editorHeading").textContent = "Edit Prompt";
            $("titleInput").value = p.title || "";
            ed.innerHTML = p.html;
          } else {
            $("editorHeading").textContent = "New Prompt";
            $("titleInput").value = "";
            ed.innerHTML = "";
          }
          show("editorView");
        }
        function closeEditor() {
          if (returnTo === "detail" && currentId && findPrompt(currentId)) openDetail(currentId);
          else { renderList(); show("listView"); }
        }
        function saveEditor() {
          var title = $("titleInput").value.trim();
          var html = $("editor").innerHTML.trim();
          if (!htmlToPlain(html)) { toast("Write or paste the prompt text first."); $("editor").focus(); return; }
          if (!title) {
            var first = htmlToPlain(html).split("\n")[0].trim();
            title = first.length > 60 ? first.slice(0, 60) + "…" : first || "Untitled prompt";
          }
          if (editingId) {
            var p = findPrompt(editingId);
            if (p) { p.title = title; p.html = html; }
            toast("Prompt updated.");
          } else {
            prompts.push({ id: newId(), title: title, html: html });
            toast("Prompt added.");
          }
          save(prompts);
          renderList();
          closeEditor();
        }

        /* toolbar — keep focus in the editor */
        function keepFocus(btn, fn) {
          btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
          btn.addEventListener("click", function () { $("editor").focus(); fn(); });
        }
        keepFocus($("tbBold"), function () { document.execCommand("bold"); });
        keepFocus($("tbHeading"), function () { document.execCommand("formatBlock", false, "H2"); });
        keepFocus($("tbNormal"), function () { document.execCommand("formatBlock", false, "P"); });
        keepFocus($("tbHighlight"), function () {
          var ok = document.execCommand("hiliteColor", false, "#fde68a");
          if (!ok) document.execCommand("backColor", false, "#fde68a");
        });
        /* Paste as plain text so pasted prompts stay clean and break into lines */
        $("editor").addEventListener("paste", function (e) {
          e.preventDefault();
          var text = (e.clipboardData || window.clipboardData).getData("text");
          document.execCommand("insertText", false, text);
        });

        /* ---------- delete ---------- */
        function askDelete(id) {
          var p = findPrompt(id);
          if (!p) return;
          pendingDeleteId = id;
          $("confirmText").textContent = "\u201C" + (p.title || "Untitled prompt") + "\u201D will be removed from this device. This cannot be undone.";
          $("confirmOverlay").classList.add("open");
        }
        function closeConfirm() {
          pendingDeleteId = null;
          $("confirmOverlay").classList.remove("open");
        }
        $("confirmCancel").addEventListener("click", closeConfirm);
        $("confirmOverlay").addEventListener("click", function (e) { if (e.target === this) closeConfirm(); });
        $("confirmDelete").addEventListener("click", function () {
          if (!pendingDeleteId) return;
          var wasDetail = currentId === pendingDeleteId;
          prompts = prompts.filter(function (p) { return p.id !== pendingDeleteId; });
          save(prompts);
          closeConfirm();
          toast("Prompt deleted.");
          renderList();
          if (wasDetail) { currentId = null; show("listView"); }
        });

        /* ---------- wiring ---------- */
        $("searchInput").addEventListener("input", renderList);
        $("addBtn").addEventListener("click", function () { openEditor(null, "list"); });
        $("detailBackBtn").addEventListener("click", function () { renderList(); show("listView"); });
        $("detailCopyBtn").addEventListener("click", function () {
          var p = findPrompt(currentId); if (p) copyPrompt(p, null);
        });
        $("detailEditBtn").addEventListener("click", function () { openEditor(currentId, "detail"); });
        $("detailDeleteBtn").addEventListener("click", function () { askDelete(currentId); });
        $("editorBackBtn").addEventListener("click", closeEditor);
        $("cancelBtn").addEventListener("click", closeEditor);
        $("saveBtn").addEventListener("click", saveEditor);

        renderList();
